name: authelia

x-daemonless:
  title: "Authelia"
  icon: ":simple-authelia:"
  category: "Infrastructure"
  description: "Authelia on FreeBSD."
  upstream_url: "https://github.com/authelia/authelia"
  web_url: "https://authelia.com/"
  freshports_url: "https://www.freshports.org/net-p2p/authelia/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"
  # authelia is the one people open; redis stays on the stack's private
  # network. AUTHELIA_SESSION_REDIS_HOST (fjord sets it; 127.0.0.1 on host
  # networking) overrides session.redis.host in configuration.yml.
  networking:
    authelia-server: default
    "*": private
  hostnames:
    redis: AUTHELIA_SESSION_REDIS_HOST
  # Sidecar for the AppJail director bundle, named as the service is so fjord
  # finds its jail by the service's name.
  appjail:
    director:
      options:
        - alias:
        - ip4_inherit:
    depends_on:
      - name: redis
        image: ghcr.io/daemonless/redis:latest
        volumes:
          redis_data: /config

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      CONFIG_LOCATION: "Path to the Authelia configuration directory (configuration.yml, users database)"
      REDIS_DATA_LOCATION: "Path to store the redis session store"
      AUTHELIA_SESSION_REDIS_HOST:
        desc: "Where Authelia finds redis; overrides session.redis.host (fjord sets this; 127.0.0.1 on host networking)"
        level: advanced
        optional: true
    volumes:
      /config: "Configuration directory"
    ports:
      9091: "Web UI"

services:
  authelia-server:
    image: ghcr.io/daemonless/authelia-server:latest
    container_name: authelia-server
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - AUTHELIA_SESSION_REDIS_HOST=${AUTHELIA_SESSION_REDIS_HOST:-127.0.0.1}
    volumes:
      - ${CONFIG_LOCATION}:/config
    ports:
      - 9091:9091
    depends_on:
      - redis

  redis:
    container_name: authelia_redis
    image: ghcr.io/daemonless/redis:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${REDIS_DATA_LOCATION}:/config
